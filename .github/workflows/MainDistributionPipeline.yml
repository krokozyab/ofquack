#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

jobs:
  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.5
      ci_tools_version: v1.5-variegata
      extension_name: ofquack
      # No process spawning, no sockets, no libcurl: the SOAP transport cannot work there.
      exclude_archs: 'wasm_mvp;wasm_eh;wasm_threads'

  code-quality-check:
    name: Code quality check
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.5
      ci_tools_version: v1.5-variegata
      extension_name: ofquack
      format_checks: 'tidy'

  # Publishes to the maintainer's own S3 bucket, for people who install with
  # `SET custom_extension_repository`. Installing `FROM community` does not go
  # through this: that channel is built and served by duckdb/community-extensions
  # from the SHA pinned in their description.yml.
  #
  # Needs S3 credentials in the repository secrets; without them the job fails,
  # which is why it only runs on a tag rather than on every push.
  duckdb-stable-deploy:
    name: Deploy extension binaries
    needs: duckdb-stable-build
    if: startsWith(github.ref, 'refs/tags/v')
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_deploy.yml@v1.5-variegata
    secrets: inherit
    with:
      duckdb_version: v1.5.5
      ci_tools_version: v1.5-variegata
      extension_name: ofquack
      deploy_latest: true
      deploy_versioned: true
      exclude_archs: 'wasm_mvp;wasm_eh;wasm_threads'
