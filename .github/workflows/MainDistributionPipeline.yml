#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
  pull_request:
  workflow_dispatch:

# Superseding a push is the point: a newer commit makes the older run's answer
# uninteresting. A manual run is different -- it is the release matrix, started
# deliberately, and an unrelated docs push must not cancel it. Mixing the run id
# into the group for a workflow_dispatch gives each dispatch a group of its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || '' }}
  cancel-in-progress: true

jobs:
  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.5
      ci_tools_version: v1.5-variegata
      extension_name: fusion_scanner
      # wasm: no process spawning, no sockets, no libcurl, so the SOAP transport
      # cannot work there at all. Shipping an artifact that always refuses is
      # worse than not shipping one.
      #
      # windows_amd64_mingw: the MSVC target, windows_amd64, is the Windows
      # build a user actually installs, and it stays. mingw is a second
      # toolchain whose failures have been about its own strictness rather than
      # about a defect anyone would meet. 132 of the 319 published community
      # extensions exclude it.
      #
      # This list must stay identical to `excluded_platforms` in
      # docs/community-extension-description.yml, or the community registry
      # builds a target this repository never builds.
      exclude_archs: 'wasm_mvp;wasm_eh;wasm_threads;windows_amd64_mingw'

  # clang-tidy, run directly rather than through
  # duckdb/extension-ci-tools' _extension_code_quality.yml.
  #
  # That reusable workflow cannot check this extension. Its `make tidy-check`
  # configures the whole of DuckDB, which needs every dependency vcpkg.json
  # declares -- and the workflow never sets vcpkg up, so the configure dies on
  # `find_package(tinyxml2)` before clang-tidy starts. It takes an
  # `extra_toolchains` input that would be the obvious place to ask for vcpkg,
  # but nothing in the file reads it. Its file filter, `<project>/src/.*/`, also
  # matches nothing in a flat `src/*.cpp` layout, so a successful configure
  # would have checked no files at all.
  #
  # scripts/tidy.sh runs the checker over this extension's own sources with
  # DuckDB's own .clang-tidy, needs no DuckDB build, and takes about a minute.
  tidy:
    name: clang-tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install clang-tidy and the headers the sources include
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy libtinyxml2-dev libssl-dev libcurl4-openssl-dev

      - name: Run clang-tidy
        run: scripts/tidy.sh

  # There is deliberately no deploy job.
  #
  # Publishing through community-extensions needs none: their registry clones
  # this repository at the SHA pinned in the descriptor, builds the whole matrix
  # itself, and serves the artifacts from their own bucket. A deploy job here
  # would only publish to a maintainer's private S3 for people installing with
  # `SET custom_extension_repository` -- and it would need S3_* secrets this
  # repository does not have, so tagging a release would fail the run for a
  # channel nobody uses.
